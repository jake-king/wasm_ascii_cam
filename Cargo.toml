[package]
name = "wasm_ascii_cam"
version = "0.2.0"
authors = ["Jake King"]
edition = "2024"
description = "Live webcam-to-ASCII renderer: Rust compiled to WebAssembly, run across a pool of Web Workers."
repository = "https://github.com/jake-king/wasm_ascii_cam"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
