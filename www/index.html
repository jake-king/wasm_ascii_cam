<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AsciiCam</title>
    <link href="css/style.css" rel="stylesheet" type="text/css">
  </head>
  <body>
    <video id="video">Video stream not available</video>
    <canvas id="canvas"></canvas>
    <div class="wrapper">
      <div class="tui-frame">
        <h2 class="tui-title" style="max-width: 50px;">Camera</h2>
        <canvas id="ascii-cam"></canvas>
      </div>
    </div>
    <div class="wrapper">
      <div class="tui-frame">
        <h2 class="tui-title">Brightness</h2>
        <a href="javascript:settings.adjust('brightness', -0.1);">[-]</a>&nbsp;<span id="brightness">1</span>&nbsp;<a href="javascript:settings.adjust('brightness', 0.1);">[+]</a>
      </div>
      <div class="tui-frame">
        <h2 class="tui-title">Contrast</h2>
        <a href="javascript:settings.adjust('contrast', -0.1);">[-]</a>&nbsp;<span id="contrast">1</span>&nbsp;<a href="javascript:settings.adjust('contrast', 0.1);">[+]</a>
      </div>
    </div>
    <noscript>This page contains webassembly and javascript content, please enable javascript in your browser.</noscript>
    <script type="module" src="js/script.js"></script>
  </body>
</html>
